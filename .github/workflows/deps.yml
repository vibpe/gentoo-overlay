name: deps-tarball

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Upstream GitHub repo (owner/name)"
        required: true
      version:
        description: "Upstream version (without leading v)"
        required: true

permissions:
  contents: write

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Build Go module deps tarball
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          p="${PACKAGE##*/}-${VERSION}"
          echo "P=${p}" >> "$GITHUB_ENV"
          curl -fsSL "https://github.com/${PACKAGE}/archive/refs/tags/v${VERSION}.tar.gz" -o "${p}.tar.gz"
          tar xf "${p}.tar.gz"
          cd "${p}"
          GOMODCACHE="$PWD/../go-mod" go mod download -modcacherw
          cd ..
          XZ_OPT=-9 tar -acf "${p}-deps.tar.xz" go-mod

      - name: Publish as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${P}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "${P}" --repo "$GITHUB_REPOSITORY" \
              --title "${P} distfiles" --notes "Go module deps tarball for ${P}."
          gh release upload "${P}" "${P}-deps.tar.xz" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Manifest hashes
        run: |
          printf 'DIST %s %s BLAKE2B %s SHA512 %s\n' \
            "${P}-deps.tar.xz" "$(stat -c%s "${P}-deps.tar.xz")" \
            "$(b2sum "${P}-deps.tar.xz" | cut -d' ' -f1)" \
            "$(sha512sum "${P}-deps.tar.xz" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
