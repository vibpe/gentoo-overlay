name: claude-code-bump

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check whether upstream stable moved
        id: check
        run: |
          cur=$(grep -L 'KEYWORDS="~' dev-util/claude-code/claude-code-*.ebuild \
            | sort -V | tail -n1 | sed -E 's/.*claude-code-(.*)\.ebuild/\1/')
          new=$(curl -fsS https://downloads.claude.ai/claude-code-releases/stable)
          echo "current=$cur upstream=$new"
          [ "$cur" != "$new" ] || exit 0
          # A pending bump PR for this version already exists.
          if git ls-remote --exit-code origin "refs/heads/bot/claude-code-$new" >/dev/null; then
            echo "bump branch already pushed"
            exit 0
          fi
          echo "bump=1" >> "$GITHUB_OUTPUT"

      - name: Bump dev-util/claude-code to upstream stable
        if: steps.check.outputs.bump
        run: |
          docker create --name portage docker.io/gentoo/portage:latest true
          docker run --rm --volumes-from portage \
            -v "$PWD":/overlay -w /overlay docker.io/gentoo/stage3:latest \
            bash -ec '
              emerge --getbinpkg --quiet dev-vcs/git
              git config --global --add safe.directory /overlay
              scripts/bump-claude-code.sh
            '

      - name: Commit and open PR if changed
        if: steps.check.outputs.bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name vibpe
          git config user.email vibpe@users.noreply.github.com
          git add dev-util/claude-code
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          ver=$(grep -L 'KEYWORDS="~' dev-util/claude-code/claude-code-*.ebuild \
            | sort -V | tail -n1 | sed -E 's/.*claude-code-(.*)\.ebuild/\1/')
          git switch -c "bot/claude-code-${ver}"
          git commit -m "dev-util/claude-code: bump stable to ${ver}"
          git push -u origin "bot/claude-code-${ver}"
          gh pr create --fill \
            --body "Automated bump; merge once the ci check is green."
