repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: pkgcheck
        name: pkgcheck scan
        language: python
        additional_dependencies: ["pkgcheck==0.10.42"]
        entry: pkgcheck scan --exit
        pass_filenames: false
        always_run: true
